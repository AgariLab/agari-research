name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agari-research
    env:
      AGARILAB_STORAGE_ROOT: ${{ github.workspace }}/.ci-storage
    steps:
      - uses: actions/checkout@v4
        with:
          path: agari-research
      - uses: actions/checkout@v4
        with:
          repository: AgariLab/agari-kit
          ref: 9e3e866a046e40fecf94d03d315c9cc000d015b1
          path: agari-kit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.6'
          enable-cache: false
      - name: Require reviewed dependency lockfile
        run: test -f uv.lock
      - name: Install complete frozen training environment
        run: python ../agari-kit/scripts/with_storage.py uv sync --frozen
      - name: Verify dependency consistency
        run: python ../agari-kit/scripts/with_storage.py uv lock --check --offline
      - name: Test training losses, checkpoints, data verification and native Agent
        run: python ../agari-kit/scripts/with_storage.py uv run --frozen python -m unittest discover -s tests -v
      - name: Test independent ranked acceptance gates with synthetic records
        run: python ../agari-kit/scripts/with_storage.py uv run --frozen python -B -m unittest discover -s experiments/riichi-ranked-100-20261028-v1 -p test_audit_ranked.py -v
      - name: Test immutable model release publication gates
        run: python ../agari-kit/scripts/with_storage.py uv run --frozen python -B experiments/full-coverage-trace-1000-v1/test_model_release_v2.py -v
